<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- The title frame and poster: the first frame of S07 with the title in the captions' own treatment (the dark band,
         Oswald in capitals, the gold glow of a lit word), as two caption lines: the title fully lit, the subtitle beneath.
         `npm run title` takes the background from the cut (assets/title-bg.png) and renders this to
         ../renders/full/title.png, which scripts/full.py puts on the cut's first frame, and to ../docs/poster.jpg. -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Oswald", sans-serif; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* the caption band (captions/build.mjs) */
      .band {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        border-radius: 14px;
        background: rgba(13, 14, 11, 0.66);
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .title {
        bottom: 168px;
        padding: 16px 52px 22px;
        font-size: 104px;
        color: rgb(255, 196, 72);
        text-shadow: 0 0 32px rgba(255, 170, 40, 0.85);
      }
      .subtitle {
        bottom: 78px;
        padding: 12px 34px 15px;
        font-size: 36px;
        font-weight: 400;
        letter-spacing: 0.16em;
        color: rgb(214, 208, 194);
      }
      .subtitle em { font-style: normal; font-weight: 500; color: rgb(236, 230, 214); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="title" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-fps="1">
      <img id="bg" class="clip" src="../assets/title-bg.png" alt="" data-start="0" data-duration="1" data-track-index="0" />
      <div class="band title">The AI Engineer's Creed</div>
      <div class="band subtitle"><span>A parody scene from <em>Full Metal Jacket</em></span></div>
    </div>
    <script>
      window.__timelines["title"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>McGurk effect demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "JetBrains Mono", monospace;
        color: #f4f4f5;
      }
      video.clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* black cards with typed lines */
      .card {
        position: absolute;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
      }
      .line {
        position: relative;
        display: block;
        font-size: 60px;
        line-height: 1.25;
        white-space: pre;
      }
      .line.small {
        font-size: 46px;
        font-style: italic;
        color: #a1a1aa;
      }
      .ghost {
        visibility: hidden;
      }
      .typed {
        position: absolute;
        left: 0;
        top: 0;
      }
      .typed .ch {
        display: none;
      }
      .prompt {
        color: #71717a;
      }
      .caret {
        display: inline-block;
        width: 0.55em;
        height: 1em;
        margin-left: 0.06em;
        vertical-align: -0.12em;
        background: #f4f4f5;
      }
      .q {
        color: #ff7b72;
      }
      /* captions over the clips */
      .cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 84px;
        display: flex;
        justify-content: center;
      }
      .cap-box {
        display: block;
        padding: 18px 34px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.76);
        font-size: 54px;
        white-space: pre;
      }
      .op {
        color: #a1a1aa;
      }
      .ok {
        color: #7ee787;
      }
      .bad {
        color: #ff7b72;
      }
      .dim {
        color: #d4d4d8;
      }
      /* rewind overlay */
      .rew {
        position: absolute;
        inset: 0;
      }
      .rew-tint {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 2px, rgba(0, 0, 0, 0) 2px 5px),
          rgba(20, 30, 60, 0.18);
      }
      .rew-badge {
        position: absolute;
        top: 64px;
        left: 72px;
        display: block;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      /* paragraph cards (C, D): wrapped text typed in place */
      .para {
        position: relative;
        display: block;
        width: 1500px;
        font-size: 52px;
        line-height: 1.38;
        white-space: pre-wrap;
      }
      .para .ch2 {
        visibility: hidden;
      }
      .para .b {
        font-weight: 700;
      }
      .para .mark {
        display: none;
        position: relative;
      }
      .para .mark::after {
        content: "";
        position: absolute;
        left: 0.04em;
        top: 0.1em;
        width: 0.55em;
        height: 1.08em;
        background: #f4f4f5;
      }
      /* typed text: no programming ligatures or contextual alternates (they shape runs like "..." across the
         per-character spans, which a live viewer can draw differently from the renderer) */
      .line,
      .para {
        font-variant-ligatures: none;
        font-feature-settings: "calt" 0, "liga" 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="49.367" data-width="1920" data-height="1080">
      <!-- 1. the fixed clip, uncaptioned: frame 0 is its first frame -->
      <video id="v-after-1" class="clip" src="assets/after.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="0" data-duration="2.2" data-track-index="0"></video>

      <!-- 2. card -->
      <section id="card-a" class="card clip" data-start="2.2" data-duration="1.85" data-track-index="0">
        <div class="line" data-text='Same exact audio...'></div>
      </section>

      <!-- 3. the McGurk clip, uncaptioned -->
      <video id="v-before-1" class="clip" src="assets/before.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="4.05" data-duration="2.2" data-track-index="0"></video>

      <!-- 4. card: the question, then the promise -->
      <section id="card-b" class="card clip" data-start="6.25" data-duration="4.5" data-track-index="0">
        <div class="line" data-text='Did you hear "Pront" in the second one?'></div>
        <div class="line small" data-text="it's the exact same audio, I promise!"></div>
      </section>

      <!-- 5. pair 2, captioned with the word each one sounds like -->
      <video id="v-after-2" class="clip" src="assets/after.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="10.75" data-duration="2.2" data-track-index="0"></video>
      <video id="v-before-2" class="clip" src="assets/before.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="12.95" data-duration="2.2" data-track-index="0"></video>
      <div id="cap-after-2" class="cap clip" data-start="10.75" data-duration="2.2" data-track-index="1">
        <span class="cap-box"><span class="dim">original</span> <span class="op">=&gt;</span> <span class="ok">"Prompt"</span></span>
      </div>
      <div id="cap-before-2" class="cap clip" data-start="12.95" data-duration="2.2" data-track-index="1">
        <span class="cap-box"><span class="dim">same audio</span> <span class="op">=&gt;</span> <span class="bad">"Pront"</span></span>
      </div>

      <!-- 6. card C: what just happened -->
      <section id="card-c" class="card clip" data-start="15.15" data-duration="8.25" data-track-index="0">
        <div class="para" data-text="Wait, wtf is going on?&#10;&#10;Both shots have the exact same audio; only the lip sync changes.&#10;&#10;This is an example of the **McGurk effect**.&#10;&#10;Let&#x27;s listen again..."></div>
      </section>

      <!-- 7. listen again: pair 3, rewind, pair 4, rewind, pair 5; only the original is labelled, with no word, so nothing biases the listener -->
      <video id="v-after-3" class="clip" src="assets/after.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="23.4" data-duration="2.2" data-track-index="0"></video>
      <video id="v-before-3" class="clip" src="assets/before.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="25.6" data-duration="2.2" data-track-index="0"></video>
      <div id="cap-after-3" class="cap clip" data-start="23.4" data-duration="2.2" data-track-index="1">
        <span class="cap-box"><span class="dim">original</span></span>
      </div>
      <video id="v-rewind-2" class="clip" src="assets/rewind.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="27.8" data-duration="0.7" data-track-index="0"></video>
      <div id="rew-2" class="rew clip" data-start="27.8" data-duration="0.7" data-track-index="1">
        <div class="rew-tint"></div>
        <span class="rew-badge">◀◀ REWIND</span>
      </div>
      <video id="v-after-4" class="clip" src="assets/after.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="28.5" data-duration="2.2" data-track-index="0"></video>
      <video id="v-before-4" class="clip" src="assets/before.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="30.7" data-duration="2.2" data-track-index="0"></video>
      <div id="cap-after-4" class="cap clip" data-start="28.5" data-duration="2.2" data-track-index="1">
        <span class="cap-box"><span class="dim">original</span></span>
      </div>
      <video id="v-rewind-3" class="clip" src="assets/rewind.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="32.9" data-duration="0.7" data-track-index="0"></video>
      <div id="rew-3" class="rew clip" data-start="32.9" data-duration="0.7" data-track-index="1">
        <div class="rew-tint"></div>
        <span class="rew-badge">◀◀ REWIND</span>
      </div>
      <video id="v-after-5" class="clip" src="assets/after.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="33.6" data-duration="2.2" data-track-index="0"></video>
      <video id="v-before-5" class="clip" src="assets/before.mp4" playsinline data-has-audio="true" data-volume="1"
        data-start="35.8" data-duration="2.2" data-track-index="0"></video>
      <div id="cap-after-5" class="cap clip" data-start="33.6" data-duration="2.2" data-track-index="1">
        <span class="cap-box"><span class="dim">original</span></span>
      </div>

      <!-- 8. card D: the recap -->
      <section id="card-d" class="card clip" data-start="38" data-duration="11.367" data-track-index="0">
        <div class="para" data-text="**The McGurk effect**: what you see changes what you hear.&#10;&#10;If a generated mouth never closes for P, B or M, viewers hear a different word, even over perfect audio.&#10;&#10;When you lip-sync AI video, check the closures, not just the timing."></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const CPS = 26; // typing speed, characters per second

      // Build each card line once: an invisible full copy sizes the line (so it stays centred while it types),
      // the typed copy reveals one character at a time, and a block caret follows the last character.
      function buildLine(line) {
        const text = line.dataset.text;
        const prefix = line.classList.contains("small") ? "" : "> ";
        line.innerHTML = "";
        const ghost = document.createElement("span");
        ghost.className = "ghost";
        ghost.textContent = prefix + text + " ";
        const typed = document.createElement("span");
        typed.className = "typed";
        if (prefix) {
          const p = document.createElement("span");
          p.className = "prompt";
          p.textContent = prefix;
          typed.appendChild(p);
        }
        const chars = [];
        let quoted = false; // a quoted word ("Pront", misspelled on purpose) types in the McGurk caption's red
        for (const c of text) {
          const s = document.createElement("span");
          if (c === '"') quoted = !quoted;
          s.className = quoted || c === '"' ? "ch q" : "ch";
          s.textContent = c;
          typed.appendChild(s);
          chars.push(s);
        }
        const caret = document.createElement("span");
        caret.className = "caret";
        typed.appendChild(caret);
        line.append(ghost, typed);
        return { chars, caret };
      }

      // type a line starting at `at`; the caret blinks while waiting, is solid while typing, and goes away at `hideAt`
      function typeLine(line, at, hideAt, waitFrom) {
        const { chars, caret } = buildLine(line);
        gsap.set(caret, { opacity: 0 });
        const blink = (from, to) => {
          const n = Math.max(0, Math.floor((to - from) / 0.5));
          for (let i = 0; i < n; i++) tl.set(caret, { opacity: i % 2 === 0 ? 1 : 0 }, from + i * 0.5);
        };
        blink(waitFrom, at);
        tl.set(caret, { opacity: 1 }, at);
        chars.forEach((c, i) => tl.set(c, { display: "inline" }, at + i / CPS));
        const done = at + chars.length / CPS;
        blink(done + 0.25, hideAt);
        tl.set(caret, { opacity: 0 }, hideAt);
        return done;
      }

      // cards A and B type from their own start and hold to their own end
      const span = (id) => {
        const el = document.getElementById(id);
        const start = parseFloat(el.dataset.start);
        return [start, start + parseFloat(el.dataset.duration)];
      };
      const [aStart, aEnd] = span("card-a");
      const [lineA] = document.querySelectorAll("#card-a .line");
      typeLine(lineA, aStart + 0.15, aEnd, aStart);

      const [bStart, bEnd] = span("card-b");
      const [lineQ, lineP] = document.querySelectorAll("#card-b .line");
      const pStart = bStart + 0.2 + [...lineQ.dataset.text].length / CPS + 0.6; // the question's caret holds until the promise starts
      typeLine(lineQ, bStart + 0.2, pStart, bStart);
      typeLine(lineP, pStart, bEnd, pStart);

      // paragraph cards: type the text in place (timing mirrors the card durations written by the build step)
      const CPS_PARA = 30, PARA_PAUSE = 0.45, LEAD = 0.2;
      function typePara(para) {
        const card = para.closest(".card");
        const start = parseFloat(card.dataset.start);
        const end = start + parseFloat(card.dataset.duration);
        const text = para.dataset.text;
        para.textContent = "";
        const add = (cls, txt) => {
          const el = document.createElement("span");
          el.className = cls;
          el.textContent = txt;
          para.appendChild(el);
          return el;
        };
        add("prompt", "> ");
        let cur = add("mark", "");
        let t = start + LEAD;
        let prev = "";
        let bold = false;
        for (let i = 0; i < text.length; i++) {
          if (text.startsWith("**", i)) {
            bold = !bold;
            i++;
            continue;
          }
          const c = text[i];
          const ch = add(bold ? "ch2 b" : "ch2", c);
          const mark = add("mark", "");
          tl.set(ch, { visibility: "visible" }, t);
          tl.set(cur, { display: "none" }, t);
          tl.set(mark, { display: "inline" }, t);
          cur = mark;
          t += 1 / CPS_PARA;
          if (c === "\n" && prev === "\n") t += PARA_PAUSE;
          prev = c;
        }
        // the caret blinks once the text is done
        const n = Math.floor((end - (t + 0.25)) / 0.5);
        for (let i = 0; i < n; i++) tl.set(cur, { display: i % 2 === 0 ? "none" : "inline" }, t + 0.25 + i * 0.5);
      }
      document.querySelectorAll(".para").forEach(typePara);

      // captions rise in at the start of each captioned clip
      document.querySelectorAll(".cap").forEach((cap) => {
        const start = parseFloat(cap.dataset.start);
        tl.fromTo(cap.querySelector(".cap-box"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, start + 0.05);
      });

      // rewind badge blinks
      document.querySelectorAll(".rew").forEach((rew) => {
        const start = parseFloat(rew.dataset.start);
        const badge = rew.querySelector(".rew-badge");
        for (let i = 0; i < 3; i++) tl.set(badge, { opacity: i % 2 === 0 ? 1 : 0.25 }, start + i * 0.24);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
